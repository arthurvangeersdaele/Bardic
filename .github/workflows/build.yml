name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/scripts/**"
      - ".github/workflows/sound-library.yml"
      - ".github/workflows/recueil.yml"
      - "BARDIC_FORMAT.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        id: apk
        run: |
          NAME="$(date +%y%m%d)_bardic-engine-test.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: bardic-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Publish as the latest dev build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest "${{ steps.apk.outputs.name }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest dev build" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}. Download the APK on your Android phone and open it to install (allow installs from your browser when asked)."
