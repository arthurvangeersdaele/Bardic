name: Recueil

# Pull requests that add .bardic files to docs/recueil/ are checked here,
# and the Recueil list (docs/recueil/index.json) and the sound library of the Story builder
# (docs/recueil/sounds.json) are rebuilt once they are merged.
on:
  pull_request:
    paths:
      - "docs/recueil/**"
  push:
    branches: [main]
    paths:
      - "docs/recueil/**"
      - ".github/scripts/build_recueil_index.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recueil-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the .bardic files and who may sign them
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          MAINTAINER: ${{ github.repository_owner }}
        run: python3 .github/scripts/build_recueil_index.py --check

  index:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build index.json and sounds.json
        run: python3 .github/scripts/build_recueil_index.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/recueil/index.json docs/recueil/sounds.json; then
            echo "index.json and sounds.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/recueil/index.json docs/recueil/sounds.json
          git commit -m "Update the Recueil index and sound library"
          git pull --rebase origin main
          git push origin HEAD:main
