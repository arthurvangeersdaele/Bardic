<!doctype html>
<html lang="en" data-theme="obsidian" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Story builder | Bardic</title>
<meta name="description" content="Build a .bardic story in your browser: chapters, music, ambience, events and soundbox. Nothing leaves your computer.">
<meta name="theme-color" content="#15151B">
<link rel="icon" type="image/svg+xml" href="../icons/261013_bardic_icon.svg">
<link rel="apple-touch-icon" href="../icons/261013_bardic_apple_touch_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../play/style.css">
<link rel="stylesheet" href="compagnie.css">
<script>
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('bardic.settings') || '{}');
      var mode = s.mode || 'dark';
      if (mode === 'system') mode = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = s.theme || 'obsidian';
      document.documentElement.dataset.mode = mode;
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="cpage fixed">
<header class="sbar">
  <a class="logo" href="../">Bardic</a>
  <nav class="tabs" aria-label="Sections">
    <a href="../play/">Play</a>
    <a href="./">Compagnie<span class="long"> des bardes</span></a>
  </nav>
  <span class="grow"></span>
  <button class="btn" type="button" id="open-btn"><span class="long">Open a .bardic</span><span class="short">Open</span></button><input type="file" id="open-input" accept=".bardic,application/zip" hidden>
</header>

<main class="bld" id="bld">
  <section class="bld-head">
    <div class="fields">
      <label class="field"><span>Story title</span><input class="title" id="f-title" maxlength="120" placeholder="The Drowned Abbey" autocomplete="off"></label>
      <label class="field"><span>Bard name</span><input id="f-author" maxlength="60" placeholder="Your name or alias" autocomplete="off"></label>
      <label class="field wide"><span>A few words for the Recueil</span><textarea id="f-desc" rows="1" maxlength="400" placeholder="A flooded monastery, a choir of ghosts and a very angry abbot."></textarea></label>
    </div>
    <div class="bld-actions">
      <span class="total" id="total"></span>
      <button class="btn primary" type="button" id="forge-btn">Forge .bardic</button>
    </div>
  </section>

  <nav class="rail" id="rail" aria-label="Chapters"></nav>

  <section class="editor" id="editor" aria-label="Chapter"></section>

  <aside class="soundbox" aria-label="Soundbox">
    <div class="sb-head"><h2>Soundbox</h2></div>
    <p class="sb-note">Quick effects for the whole story: critical hits, level ups, explosions.</p>
    <div class="dz" id="sb-zone" data-zone="soundbox"></div>
  </aside>
</main>
</div>
<input type="file" id="pick" accept=".mp3,.ogg,.m4a,.wav,audio/*" multiple hidden>
<script src="bardic-format.js"></script>
<script src="builder.js"></script>
</body>
</html>
